name: skill-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skill:
    name: Testes (${{ matrix.os }} · Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.9" }    # o ubuntu-latest (26.04) não tem o Python 3.9
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  schemas:
    name: JSON validado pelos schemas da Microsoft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Projeto de exemplo e modelos de página
        run: python tools/validate_schemas.py
      - name: Exemplos JSON das referências
        run: python tools/validate_schemas.py --references

  pbiviz:
    name: Visual de referência compila com as ferramentas oficiais
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Criar projeto com pbiviz e aplicar o template
        run: |
          npm install -g powerbi-visuals-tools@7
          mkdir /tmp/v && cd /tmp/v
          pbiviz new ciVisual
          T=$GITHUB_WORKSPACE/skills/powerbi-architect/templates/pbiviz-bullet-kpi
          cp -r $T/src $T/style $T/stringResources $T/capabilities.json ciVisual/
          cd ciVisual
          npm install --no-audit --no-fund d3-selection d3-scale @types/d3-selection @types/d3-scale
          node -e "const f='pbiviz.json',p=require('./'+f);p.author={name:'ci',email:'ci@example.com'};p.visual.description='ci';p.visual.supportUrl='https://example.com';require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
      - name: Lint (configuração oficial) e empacotamento
        working-directory: /tmp/v/ciVisual
        run: |
          npx eslint .
          pbiviz package
          ls dist/*.pbiviz
