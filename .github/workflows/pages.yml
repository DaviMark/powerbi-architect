name: pages

# Publica a página do benchmark (benchmarks/index.html) no GitHub Pages a cada mudança na main.
on:
  push:
    branches: [main]
    paths: ["benchmarks/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar o benchmark no GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write       # publish the site
      id-token: write    # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Montar o site (página, imagens e dados de cada versão)
        run: |
          mkdir -p _site
          cp benchmarks/index.html benchmarks/painel.png _site/
          for d in benchmarks/versoes/*/; do
            v=$(basename "$d")
            mkdir -p "_site/versoes/$v"
            cp -r "$d/imagens" "_site/versoes/$v/"
            cp "$d/resultados.json" "_site/versoes/$v/"
          done
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
